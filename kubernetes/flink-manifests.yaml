# ============================================
# FLINK CLUSTER - With Adaptive Scheduler
# ============================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: flink

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-config
  namespace: flink
data:
  flink-conf.yaml: |
    jobmanager.rpc.address: flink-jobmanager
    jobmanager.rpc.port: 6123
    jobmanager.memory.process.size: 1600m
    taskmanager.memory.process.size: 1728m
    taskmanager.numberOfTaskSlots: 2
    parallelism.default: 2

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: flink

---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: flink
spec:
  type: ClusterIP
  ports:
  - name: rpc
    port: 6123
  - name: blob-server
    port: 6124
  - name: webui
    port: 8081
  selector:
    app: flink
    component: jobmanager

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: flink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
      component: jobmanager
  template:
    metadata:
      labels:
        app: flink
        component: jobmanager
    spec:
      serviceAccountName: flink
      containers:
      - name: jobmanager
        image: flink:1.18.0
        args: ["jobmanager"]
        ports:
        - containerPort: 6123
          name: rpc
        - containerPort: 6124
          name: blob-server
        - containerPort: 8081
          name: webui
        env:
        - name: FLINK_PROPERTIES
          value: |
            jobmanager.rpc.address: flink-jobmanager
            jobmanager.rpc.port: 6123
            jobmanager.memory.process.size: 1024m
            taskmanager.memory.process.size: 1024m
            taskmanager.numberOfTaskSlots: 2
            parallelism.default: 2
            slot.request.timeout: 120000
            jobmanager.scheduler: adaptive
            pipeline.max-parallelism: 120
            state.savepoints.dir: file:///tmp/savepoints
            state.checkpoints.dir: file:///tmp/checkpoints
            execution.checkpointing.interval: 30s
            execution.checkpointing.mode: AT_LEAST_ONCE
            jobmanager.adaptive-scheduler.resource-stabilization-timeout: 10s
            jobmanager.adaptive-scheduler.resource-wait-timeout: 60s

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: flink
spec:
  replicas: 5
  selector:
    matchLabels:
      app: flink
      component: taskmanager
  template:
    metadata:
      labels:
        app: flink
        component: taskmanager
        priority: "5"
    spec:
      serviceAccountName: flink
      schedulerName: adaptive-scheduler
      containers:
      - name: taskmanager
        image: flink:1.18.0
        args: ["taskmanager"]
        ports:
        - containerPort: 6122
          name: rpc
        env:
        - name: FLINK_PROPERTIES
          value: |
            jobmanager.rpc.address: flink-jobmanager
            jobmanager.rpc.port: 6123
            jobmanager.memory.process.size: 1024m
            taskmanager.memory.process.size: 1024m
            taskmanager.numberOfTaskSlots: 2
            parallelism.default: 2
            slot.request.timeout: 120000
            jobmanager.scheduler: adaptive
            pipeline.max-parallelism: 120
            state.checkpoints.dir: file:///tmp/checkpoints
            execution.checkpointing.interval: 30s
            execution.checkpointing.mode: AT_LEAST_ONCE